name: sisi_row
description: SiSi ULP Toboali (offline first).
publish_to: none
version: 0.58.3+62

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # versi dikunci oleh flutter_localizations
  geolocator: ^14.0.0
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  image: ^4.2.0
  camera: ^0.11.1
  gal: ^2.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Ikon app = logo SiSi (v0.37). Jalankan sekali setelah logo berubah: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-sisi.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo-sisi.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
